openapi: 3.0.3
info:
  title: Evidura
  version: 0.1.0
  description: >-
    Health-AI underwriting system for payers, providers, and purchasing coalitions.
    Evidura maps a buyer-owned capability taxonomy over a churning vendor market,
    appraises whether an offering's evidence transfers to the buyer's own
    population, verifies regulatory status against intended use, grades vendor
    viability in a consolidating market, recommends protective contract terms, and
    keeps re-underwriting after signature.
  x-product-slug: ai-health-evidura
  x-source: ai-in-health/Accenture-Chart-The-AI-Health-Market-Explosive-Growth/
servers:
  - url: https://api.example.com
tags:
  - name: Market Map
    description: Buyer-owned capability taxonomy and vendor language mapping
  - name: Vendors
    description: Vendor and offering directory with regulatory records
  - name: Evidence
    description: Study appraisal, population transfer, and prevalence effects
  - name: Viability
    description: Counterparty underwriting and consolidation exposure
  - name: Evaluations
    description: Scorecards, conflict disclosure, completeness gating, and decisions
  - name: Contracts
    description: Protective term sets, waivers, and total cost models
  - name: Portfolio Overlap
    description: Functional duplication and vendor concentration
  - name: Alerts
    description: Market events matched to the contract book
paths:
  /v1/capability-categories:
    get:
      operationId: listCapabilityCategories
      tags: [Market Map]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Capability categories page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCapabilityCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCapabilityCategory
      tags: [Market Map]
      description: >-
        Defines a category by the clinical or financial job performed, not by vendor
        marketing language.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityCategoryCreate"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapabilityCategory"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/capability-categories/{categoryId}/mappings:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mapVendorLanguageToCategory
      tags: [Market Map]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offeringId, vendorTerm, approvedBy]
              properties:
                offeringId:
                  type: string
                vendorTerm:
                  type: string
                approvedBy:
                  type: string
                note:
                  type: string
      responses:
        "201":
          description: Mapping approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapabilityCategory"
  /v1/vendors:
    get:
      operationId: listVendors
      tags: [Vendors]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: viabilityGrade
          in: query
          schema:
            $ref: "#/components/schemas/ViabilityGrade"
        - name: underContract
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Vendors page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeVendor"
    post:
      operationId: createVendor
      tags: [Vendors]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCreate"
      responses:
        "201":
          description: Vendor added to the directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeVendor"
  /v1/vendors/{vendorId}/offerings:
    parameters:
      - $ref: "#/components/parameters/VendorId"
    get:
      operationId: listVendorOfferings
      tags: [Vendors]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Offerings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOffering"
    post:
      operationId: createOffering
      tags: [Vendors]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferingCreate"
      responses:
        "201":
          description: Offering added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOffering"
  /v1/offerings/{offeringId}/regulatory-record:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    put:
      operationId: verifyRegulatoryRecord
      tags: [Vendors]
      description: >-
        Records status verified against the authoritative register and compares the
        cleared intended use with the workflow and population the buyer plans.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulatoryRecord"
      responses:
        "200":
          description: Regulatory record verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRegulatoryRecord"
  /v1/offerings/{offeringId}/intended-use-escalations:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    post:
      operationId: escalateIntendedUseGap
      tags: [Vendors]
      description: >-
        Raises the case where the buyer's planned use falls outside the cleared
        indication, for explicit acceptance before purchase.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gapDescription, raisedBy]
              properties:
                gapDescription:
                  type: string
                gapType:
                  type: string
                  enum: [population_outside_indication, workflow_outside_indication, output_used_differently, no_clearance_claimed]
                raisedBy:
                  type: string
                acceptedBy:
                  type: string
                acceptanceRationale:
                  type: string
      responses:
        "201":
          description: Escalation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRegulatoryRecord"
  /v1/offerings/{offeringId}/evidence-items:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    get:
      operationId: listEvidenceItems
      tags: [Evidence]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Evidence items page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEvidenceItem"
    post:
      operationId: appraiseEvidenceItem
      tags: [Evidence]
      description: >-
        Structured appraisal of one study or vendor claim. Missing design,
        population, calibration, or subgroup information is recorded as a finding
        rather than left blank.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceItemCreate"
      responses:
        "201":
          description: Evidence appraised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEvidenceItem"
  /v1/offerings/{offeringId}/population-match:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    post:
      operationId: assessPopulationMatch
      tags: [Evidence]
      description: >-
        Computes how the buyer's population differs from the study population and
        what local prevalence does to the operating point the vendor recommends.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationMatchAssessmentCreate"
      responses:
        "200":
          description: Population transfer assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePopulationMatchAssessment"
        "422":
          description: Local prevalence or cohort definition missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/vendors/{vendorId}/viability-assessments:
    parameters:
      - $ref: "#/components/parameters/VendorId"
    get:
      operationId: listViabilityAssessments
      tags: [Viability]
      description: Time series of grades, so that a downgrade can be dated.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Viability assessments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeViabilityAssessment"
    post:
      operationId: underwriteVendorViability
      tags: [Viability]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViabilityAssessmentCreate"
      responses:
        "201":
          description: Viability graded with refresh date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeViabilityAssessment"
  /v1/vendors/{vendorId}/consolidation-events:
    parameters:
      - $ref: "#/components/parameters/VendorId"
    post:
      operationId: recordConsolidationEvent
      tags: [Viability]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsolidationEvent"
      responses:
        "201":
          description: Event recorded and matched to exposed contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsolidationEvent"
  /v1/evaluations:
    get:
      operationId: listEvaluationProjects
      tags: [Evaluations]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, appraising, file_incomplete, ready_for_vote, decided, withdrawn]
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/DecisionOutcome"
      responses:
        "200":
          description: Evaluation projects page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEvaluationProject"
    post:
      operationId: openEvaluationProject
      tags: [Evaluations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationProjectCreate"
      responses:
        "201":
          description: Evaluation opened with completeness checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEvaluationProject"
  /v1/evaluations/{evaluationId}/conflict-disclosures:
    parameters:
      - $ref: "#/components/parameters/EvaluationId"
    post:
      operationId: discloseConflictOfInterest
      tags: [Evaluations]
      description: >-
        Mandatory before scoring. An undisclosed relationship discovered later
        invalidates the affected scores and forces a re-vote.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictDisclosure"
      responses:
        "201":
          description: Disclosure recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConflictDisclosure"
  /v1/evaluations/{evaluationId}/scorecards:
    parameters:
      - $ref: "#/components/parameters/EvaluationId"
    post:
      operationId: submitScorecard
      tags: [Evaluations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScorecardResultCreate"
      responses:
        "201":
          description: Scorecard submitted with any dissent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScorecardResult"
        "409":
          description: Conflict disclosure missing for this evaluator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evaluations/{evaluationId}/data-use-authorisations:
    parameters:
      - $ref: "#/components/parameters/EvaluationId"
    post:
      operationId: authoriseEvaluationDataUse
      tags: [Evaluations]
      description: >-
        Records the lawful basis, agreement in force, minimisation applied, and
        end-of-evaluation disposition before any patient data moves to a candidate.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationDataUseAuthorisation"
      responses:
        "201":
          description: Data use authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEvaluationDataUseAuthorisation"
        "422":
          description: Agreement or lawful basis missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evaluations/{evaluationId}/decision:
    parameters:
      - $ref: "#/components/parameters/EvaluationId"
    post:
      operationId: recordEvaluationDecision
      tags: [Evaluations]
      description: >-
        Proceed, proceed with conditions, decline, or defer. Declines are retained
        and searchable so the organisation stops re-evaluating from zero.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRecordCreate"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionRecord"
        "409":
          description: Evaluation file incomplete, vote blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/decisions:
    get:
      operationId: listDecisionRecords
      tags: [Evaluations]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: offeringId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/DecisionOutcome"
      responses:
        "200":
          description: Decision records page including prior declines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDecisionRecord"
  /v1/offerings/{offeringId}/contract-terms:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    get:
      operationId: getRecommendedContractTerms
      tags: [Contracts]
      description: >-
        Protective clause set recommended for this vendor's viability grade, with the
        reasoning that justifies each demand.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recommended and secured protections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContractTermSet"
    put:
      operationId: recordSecuredContractTerms
      tags: [Contracts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractTermSet"
      responses:
        "200":
          description: Secured protections recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContractTermSet"
  /v1/offerings/{offeringId}/contract-terms/waivers:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    post:
      operationId: waiveContractProtection
      tags: [Contracts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protection, riskOwnerId, approvedBy, rationale]
              properties:
                protection:
                  $ref: "#/components/schemas/ProtectionType"
                riskOwnerId:
                  type: string
                approvedBy:
                  type: string
                rationale:
                  type: string
                reviewBy:
                  type: string
                  format: date
      responses:
        "201":
          description: Waiver recorded as an accepted risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContractTermSet"
  /v1/offerings/{offeringId}/cost-model:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    put:
      operationId: setTotalCostModel
      tags: [Contracts]
      description: >-
        Licence, integration, interface, clinician time, validation, monitoring, and
        exit costs, normalised per unit of clinical or administrative work.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotalCostModel"
      responses:
        "200":
          description: Cost model recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTotalCostModel"
  /v1/offerings/{offeringId}/integration-profile:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    put:
      operationId: setIntegrationProfile
      tags: [Contracts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationProfile"
      responses:
        "200":
          description: Integration profile recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIntegrationProfile"
  /v1/portfolio/overlap-findings:
    get:
      operationId: listOverlapFindings
      tags: [Portfolio Overlap]
      description: >-
        Functional duplication between a candidate offering and contracts already
        held, with the incumbent spend attached.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, decided, dismissed]
      responses:
        "200":
          description: Overlap findings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOverlapFinding"
  /v1/portfolio/overlap-findings/{findingId}/decision:
    parameters:
      - name: findingId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: decideOverlapFinding
      tags: [Portfolio Overlap]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, decidedBy]
              properties:
                decision:
                  type: string
                  enum: [consolidate_to_incumbent, consolidate_to_candidate, coexist, defer]
                decidedBy:
                  type: string
                rationale:
                  type: string
                spendReleased:
                  $ref: "#/components/schemas/Money"
      responses:
        "200":
          description: Overlap decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOverlapFinding"
  /v1/portfolio/concentration:
    get:
      operationId: getPortfolioConcentration
      tags: [Portfolio Overlap]
      security:
        - BearerAuth: []
      parameters:
        - name: dimension
          in: query
          schema:
            type: string
            enum: [vendor, ultimate_owner, capability_category, viability_grade]
      responses:
        "200":
          description: Concentration of committed spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePortfolioConcentration"
  /v1/alerts:
    get:
      operationId: listMarketAlerts
      tags: [Alerts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: eventType
          in: query
          schema:
            $ref: "#/components/schemas/MarketEventType"
        - name: unacknowledgedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Alerts page with exposed contracts and held protections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeMarketAlert"
    post:
      operationId: ingestMarketEvent
      tags: [Alerts]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEventSubmission"
      responses:
        "202":
          description: Event accepted and matched to the contract book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMarketAlert"
  /v1/alerts/{alertId}/acknowledgement:
    parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: acknowledgeMarketAlert
      tags: [Alerts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgedBy, action]
              properties:
                acknowledgedBy:
                  type: string
                action:
                  type: string
                  enum: [invoke_protection, renegotiate, plan_exit, accept_and_monitor, no_action_required]
                note:
                  type: string
      responses:
        "200":
          description: Alert acknowledged by the contract owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMarketAlert"
  /v1/re-underwriting/schedule:
    get:
      operationId: listReUnderwritingSchedule
      tags: [Viability]
      description: >-
        Offerings under contract whose evidence or viability appraisal is due or
        overdue for refresh.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: overdueOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Re-underwriting schedule page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOffering"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
    OfferingId:
      name: offeringId
      in: path
      required: true
      schema:
        type: string
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: USD
    ViabilityGrade:
      type: string
      enum: [durable, adequate, watch, fragile, unrateable]
    DecisionOutcome:
      type: string
      enum: [proceed, proceed_with_conditions, decline, defer]
    ProtectionType:
      type: string
      enum:
        - model_artefact_escrow
        - configuration_escrow
        - data_and_output_portability
        - transition_assistance
        - change_of_control_consent
        - price_protection_on_acquisition
        - local_performance_remedy
        - retraining_commitment
        - post_market_surveillance_duty
        - source_code_escrow
        - continuity_of_support_commitment
    MarketEventType:
      type: string
      enum:
        - acquisition
        - funding_round
        - funding_failure
        - insolvency
        - product_discontinued
        - recall
        - safety_communication
        - clearance_change
        - leadership_change
        - breach_disclosure
